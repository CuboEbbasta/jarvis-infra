name: jarvis

services:
  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - litellm-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    depends_on:
      litellm-db:
        condition: service_healthy
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD}@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks: [default, osiris-llm]   # osiris-llm: rete dedicata, vista SOLO da OSIRIS (modello locale per le previsioni OI)
    ports:
      - "127.0.0.1:4000:4000"   # solo da questo PC, non dalla rete

  hermes:
    image: nousresearch/hermes-agent:stable
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on: [litellm]
    environment:
      TZ: Europe/Rome
    volumes:
      - ../hermes-data:/opt/data              # config, memoria, skill, sessioni di Hermes
      - ../DBVault:/vault:ro                  # vault in SOLA LETTURA
      - ../DBVault/Machine:/vault/Machine     # unica area scrivibile
    profiles: ["hermes"]                      # si avvia solo con --profile hermes
    # nessuna porta esposta: si usa da Telegram

networks:
  osiris-llm:
    name: jarvis-osiris-llm      # solo litellm + osiris: OSIRIS non vede Ollama, il database né il resto del PC

volumes:
  litellm-db:
